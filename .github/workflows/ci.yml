name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Ensure extension release artifacts are committed
        run: |
          changes="$(git status --porcelain --untracked-files=all -- apps/extension/manifests/chrome.json apps/web/public/downloads/pinhere-extension-v*.zip)"
          if [ -n "$changes" ]; then
            echo "$changes"
            echo "Run 'pnpm extension:release <version>' and commit the generated release files."
            exit 1
          fi
